name: conformance

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto

jobs:
  fixture-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout ws-mixer-spec @ pin
        run: git clone --depth 1 --branch "$(cat spec.pin)" https://github.com/mcpwarp/ws-mixer-spec.git .spec
      - run: go build -tags conformance -o build/go-adapter ./cmd/conformance-adapter
      # .spec is a nested Go module (its own go.mod), so `go run ./.spec/...`
      # cannot be invoked relative to this repo's module -- cd into it first
      # and pass absolute paths for everything that must resolve back here.
      - run: |
          repo="$PWD"
          (cd .spec && go run ./conformance/runner \
            --spec-root "$repo/.spec" \
            --adapter go="$repo/build/go-adapter" \
            --sdk go --mode fixture \
            --counts "$repo/conformance/COUNTS.json" \
            --report "$repo/build/conformance-fixture.xml")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-fixture
          path: build/*.xml
          if-no-files-found: warn

  pair-go-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout ws-mixer-spec @ pin
        run: git clone --depth 1 --branch "$(cat spec.pin)" https://github.com/mcpwarp/ws-mixer-spec.git .spec
      - run: go build -tags conformance -o build/go-adapter ./cmd/conformance-adapter
      # .spec is a nested Go module (its own go.mod), so `go run ./.spec/...`
      # cannot be invoked relative to this repo's module -- cd into it first
      # and pass absolute paths for everything that must resolve back here.
      - run: |
          repo="$PWD"
          (cd .spec && go run ./conformance/runner \
            --spec-root "$repo/.spec" \
            --adapter go="$repo/build/go-adapter" \
            --sdk go --mode pair \
            --counts "$repo/conformance/COUNTS.json" \
            --report "$repo/build/conformance-pair.xml")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-pair
          path: build/*.xml
          if-no-files-found: warn
