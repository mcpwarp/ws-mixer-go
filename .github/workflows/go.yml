name: go

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./wsmixer/... ./cmd/...
      - run: go vet -tags conformance ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout ws-mixer-spec @ pin
        run: git clone --depth 1 --branch "$(cat spec.pin)" https://github.com/mcpwarp/ws-mixer-spec.git .spec
      - run: go test -count=1 ./...
        env:
          WSMIXER_SPEC_DIR: ${{ github.workspace }}/.spec

  race:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout ws-mixer-spec @ pin
        run: git clone --depth 1 --branch "$(cat spec.pin)" https://github.com/mcpwarp/ws-mixer-spec.git .spec
      - run: go test -race -count=1 ./...
        env:
          WSMIXER_SPEC_DIR: ${{ github.workspace }}/.spec

  build-tags-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build -tags conformance ./...
      - run: go test -tags conformance -race -count=1 ./conformance/adapter/...
